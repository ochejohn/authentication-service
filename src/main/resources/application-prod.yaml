spring:
  config:
    activate:
      on-profile: prod

  application:
    name: authentication-service

  # =========================
  # MySQL
  # =========================
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =========================
  # JPA
  # =========================
  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: false

  # =========================
  # Flyway
  # =========================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # =========================
  # Redis
  # =========================
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

      repositories:
        enabled: false

  # =========================
  # Mailpit
  # =========================
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: false

          starttls:
            enable: false


# =========================
# Server
# =========================
server:
  port: ${SERVER_PORT:8080}


# =========================
# Actuator
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info


# =========================
# JWT Security
# =========================
security:
  jwt:
    secret: ${JWT_SECRET}

    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}

    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}


# =========================
# Application
# =========================
app:
  frontend-url: ${FRONTEND_URL}

  verification-url: ${VERIFICATION_URL}