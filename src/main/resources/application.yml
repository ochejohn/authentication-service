spring:
  application:
    name: authentication-service

  datasource:
    url: jdbc:mysql://localhost:3306/authentication_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Kemikemi24*
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      repositories:
        enabled: false

  mail:
    host: localhost
    port: 1025
    username: no-reply@authentication.com
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO



security:
  jwt:
    secret: my-super-secret-key-for-jwt-authentication-service-256-bits
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

app:
  frontend-url: http://localhost:3000
  verification-url: http://localhost:8080/api/auth/verify-email